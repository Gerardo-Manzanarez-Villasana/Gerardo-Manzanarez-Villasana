name: Update ORCID Papers

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta diariamente a medianoche
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch ORCID Works and Update README
        run: |
          python -c "
          import urllib.request
          import json
          import re

          orcid_id = '0009-0004-9666-3315'
          url = f'https://pub.orcid.org/v3.0/{orcid_id}/works'
          req = urllib.request.Request(url, headers={'Accept': 'application/json'})

          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())

              group = data.get('group', [])
              papers = []

              for item in group[:5]: # Obtiene las 5 publicaciones más recientes
                  summary = item['work-summary'][0]
                  title = summary.get('title', {}).get('title', {}).get('value', 'Sin título')

                  # Extraer año de publicación
                  pub_date = summary.get('publication-date')
                  year = pub_date.get('year', {}).get('value', '') if pub_date else ''

                  # Extraer DOI o enlace directo
                  external_ids = summary.get('external-ids', {}).get('external-id', [])
                  doi_url = None
                  for ext in external_ids:
                      if ext.get('external-id-type') == 'doi':
                          val = ext.get('external-id-value', '')
                          doi_url = val if val.startswith('http') else f'https://doi.org/{val}'
                          break

                  link = doi_url if doi_url else f'https://orcid.org/{orcid_id}'
                  year_str = f' ({year})' if year else ''
                  papers.append(f'- [{title}]({link}){year_str}')

              content = '\n'.join(papers) if papers else '- No se encontraron publicaciones.'

              with open('README.md', 'r', encoding='utf-8') as f:
                  readme = f.read()

              pattern = r'<!-- PAPERS:START -->.*?<!-- PAPERS:END -->'
              replacement = f'<!-- PAPERS:START -->\n{content}\n<!-- PAPERS:END -->'
              updated_readme = re.sub(pattern, replacement, readme, flags=re.DOTALL)

              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(updated_readme)

          except Exception as e:
              print(f'Error al consultar la API: {e}')
          "

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: actualización automática de publicaciones ORCID"
          git push